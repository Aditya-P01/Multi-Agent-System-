<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Studio | Multi-Agent Concierge</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0a0f;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            color: #a78bfa;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .markdown-content ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .markdown-content li {
            margin-bottom: 0.5rem;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple SVG Icons to avoid Lucide CDN issues
        const SparklesIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-sparkles"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
        );

        const App = () => {
            const [prompt, setPrompt] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [step, setStep] = useState(0);

            const steps = [
                { title: 'Intake', agent: 'Coordinator' },
                { title: 'Activities', agent: 'Expert Planner' },
                { title: 'Logistics', agent: 'Logistics Expert' },
                { title: 'Review', agent: 'Lead Curator' }
            ];

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!prompt) return alert('Please provide a trip request');
                
                setLoading(true);
                setResult(null);
                setStep(0);

                const interval = setInterval(() => {
                    setStep(prev => (prev < 3 ? prev + 1 : prev));
                }, 3500);

                try {
                    console.log("Sending request to /api/plan...");
                    const response = await fetch('/api/plan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_input: prompt })
                    });
                    
                    const data = await response.json();
                    if (response.ok) {
                        setResult(data);
                        setStep(4);
                    } else {
                        alert(data.detail || 'Something went wrong');
                    }
                } catch (err) {
                    console.error(err);
                    alert('Error connecting to backend. Is it running on port 8000?');
                } finally {
                    setLoading(false);
                    clearInterval(interval);
                }
            };

            return (
                <div className="max-w-4xl mx-auto space-y-8">
                    {/* Header */}
                    <div className="text-center py-10 space-y-4">
                        <div className="inline-block p-3 glass rounded-2xl glow animate-float mb-4">
                            <SparklesIcon />
                        </div>
                        <h1 className="text-5xl font-bold gradient-text pb-2">AI Travel Studio</h1>
                        <p className="text-slate-400 text-lg">Multi-Agent Orchestration for the Modern Traveler</p>
                    </div>

                    {/* Input Panel */}
                    <div className="glass rounded-3xl p-6 md:p-8 space-y-6">
                        <div className="space-y-2">
                            <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">The Mission</label>
                            <textarea 
                                value={prompt}
                                onChange={(e) => setPrompt(e.target.value)}
                                placeholder="I want a 7-day winter trek in Nepal focusing on photography..."
                                className="w-full h-32 bg-black/40 border border-white/5 rounded-2xl p-4 focus:outline-none focus:border-indigo-500 transition-all text-slate-200 resize-none md:text-lg"
                            />
                        </div>

                        <button 
                            onClick={handleSubmit}
                            disabled={loading}
                            className="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2 glow active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed text-lg"
                        >
                            {loading ? 'Orchestrating Agents...' : 'Generate Itinerary'}
                        </button>
                    </div>

                    {/* Progress Indicator */}
                    {loading && (
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            {steps.map((s, i) => (
                                <div key={i} className={`glass p-4 rounded-2xl flex items-center gap-3 transition-colors duration-500 ${step >= i ? 'border-indigo-500/50 bg-indigo-500/10' : 'opacity-40'}`}>
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold ${step >= i ? 'bg-indigo-500 text-white' : 'bg-slate-800 text-slate-500'}`}>
                                        {i + 1}
                                    </div>
                                    <div>
                                        <div className="text-[10px] uppercase tracking-tighter text-slate-500 font-bold">{s.agent}</div>
                                        <div className="text-sm font-semibold">{s.title}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Result Display */}
                    {result && (
                        <div className="space-y-6 fade-in">
                            <div className="flex items-center gap-4 py-4">
                                <div className="h-px flex-1 bg-gradient-to-r from-transparent to-white/10"></div>
                                <span className="text-slate-500 text-sm font-medium tracking-widest uppercase">The Master Plan</span>
                                <div className="h-px flex-1 bg-gradient-to-l from-transparent to-white/10"></div>
                            </div>

                            <div className="glass rounded-3xl p-8 relative overflow-hidden backdrop-blur-3xl">
                                <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-600/5 blur-[100px] -mr-32 -mt-32"></div>
                                <div 
                                    className="markdown-content text-slate-300 leading-relaxed relative"
                                    dangerouslySetInnerHTML={{ __html: marked.parse(result.final_itinerary) }}
                                ></div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <div className="text-center py-10 opacity-30 text-sm">
                        Built with Multi-Agent Intelligence • LangGraph & Groq
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
